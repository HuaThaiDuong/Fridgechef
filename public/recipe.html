<!DOCTYPE html>
<html lang="en" data-ui="board">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recipe — FridgeChef</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;600;700&family=Libre+Bodoni:wght@500;700&family=Nunito+Sans:wght@400;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Public+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/base.css" />
    <link rel="stylesheet" href="/css/components.css" />
    <link rel="stylesheet" href="/css/layout.css" />
    <link rel="stylesheet" href="/css/ui-drafts.css" />
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="site-header">
      <div class="container header-inner">
        <a class="logo" href="/">
          <span class="logo-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path d="M6.5 11.2C6.5 8.1 8.9 5.6 12 5.6s5.5 2.5 5.5 5.6c1.8.3 3.2 1.9 3.2 3.8 0 .3-.3.6-.6.6H3.9c-.3 0-.6-.3-.6-.6 0-1.9 1.4-3.5 3.2-3.8z" />
              <path d="M4.5 16h15v1.6c0 .7-.6 1.2-1.2 1.2H5.7c-.7 0-1.2-.5-1.2-1.2V16z" />
              <path d="M7 19.4h10v1.4c0 .4-.3.8-.8.8H7.8c-.4 0-.8-.4-.8-.8v-1.4z" />
            </svg>
          </span>
          FridgeChef
        </a>
        <nav class="site-nav" aria-label="Primary">
          <a href="/">My Fridge</a>
          <a href="/#recent">Recently viewed recipes</a>
        </nav>
      </div>
    </header>

    <main id="main" class="container recipe-page">
      <p><a class="btn ghost" href="/">Back to fridge</a></p>

      <div id="recipe-error" class="error-state" hidden role="alert">
        <h2>Recipe not found</h2>
        <p>We couldn’t open this dish.</p>
      </div>

      <article id="recipe-content" hidden>
        <header class="recipe-hero">
          <img id="recipe-image" alt="" loading="lazy" referrerpolicy="no-referrer" />
          <h1 id="recipe-title"></h1>
          <div class="recipe-meta">
            <span class="badge" id="recipe-cuisine"></span>
            <span class="badge time" id="recipe-time"></span>
            <span class="badge difficulty" id="recipe-difficulty"></span>
            <span class="badge" id="recipe-servings"></span>
          </div>
        </header>

        <div class="recipe-layout">
          <aside class="ingredient-panel" aria-labelledby="ingredients-title">
            <h2 id="ingredients-title">Ingredients</h2>
            <p class="small">Green means you have it. Amber means it’s still missing.</p>
            <ul class="ingredient-list" id="ingredient-list"></ul>
          </aside>
          <section aria-labelledby="steps-title">
            <h2 id="steps-title">Steps</h2>
            <ol class="step-list" id="step-list"></ol>
          </section>
        </div>
      </article>
    </main>

    <footer class="site-footer">
      <p>FridgeChef — cook from what you already have.</p>
    </footer>

    <div id="toast" class="toast" hidden role="status" aria-live="polite"></div>

    <script src="/js/api.js"></script>
    <script src="/js/recipe-detail.js"></script>
  </body>
</html>
